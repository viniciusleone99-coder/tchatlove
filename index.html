function mcard(m){return `<button class="module-card" data-mid="${m.id}" data-action="module">${pic(m.photo,'Photo d’illustration : '+m.name)}<div class="module-top"><b>${m.id.slice(-1).padStart(2,'0')}</b><span>3 LEÇONS</span></div><div class="module-bottom"><h3>${esc(m.name)}</h3><p>${esc(m.eyebrow)}</p><div class="progress"><span style="width:${completion(m)}%"></span></div><div class="small">${completion(m)}% terminé &nbsp; →</div></div></button>`}
function home(){let total=countDone();return `<section class="hero"><div class="hero-content"><div class="eyebrow">L’ART DE LA PRÉSENCE ET DES MOTS</div><h1>L’attirance commence <em>avant</em> les premiers mots.</h1><p>Une formation immersive sur la conversation, l’attirance et l’intimité. Des recherches traduites en situations concrètes — sans phrases magiques ni promesses impossibles.</p><div class="btn-row"><button class="btn btn-primary" data-go="modules">${ico('book')} Découvrir les 5 modules</button><button class="btn btn-white" data-go="cases">Découvrir un dialogue ${ico('arrow')}</button></div><div class="hero-bottom"><span>5 modules</span><i></i><span>15 leçons inédites</span><i></i><span>8 mises en situation</span></div></div><div class="hero-media">${pic('dinner','Photo d’illustration : deux personnes lors d’un dîner')}<div class="hero-stamp"><b>CONFIANCE & PRÉSENCE</b><span>UNE EXPÉRIENCE D’APPRENTISSAGE</span></div></div></section><section class="metrics"><div class="metric"><span class="micon">01</span><div><b>Recherche documentée</b><p>Publications citées et contextualisées</p></div></div><div class="metric"><span class="micon">02</span><div><b>Exercices concrets</b><p>Dialogues et choix commentés</p></div></div><div class="metric"><span class="micon">03</span><div><b>À votre rythme</b><p>Progression et notes privées</p></div></div></section><section><div class="sectionhead"><div><span class="eyebrow" style="color:#a2825e">LE PARCOURS</span><h2 class="serif">Les cinq dimensions de la connexion.</h2><p>Cinq compétences. Cinq façons de progresser.</p></div><span class="small muted">${total} leçons terminées sur 15</span></div><div class="module-grid">${COURSE.modules.map(mcard).join('')}</div></section><div class="feature-section"><article class="feature-panel dark"><span class="eyebrow">MISE EN PRATIQUE</span><h3>Comprendre ce qui se joue<br>entre les mots.</h3><p>Parcourez un dialogue de bout en bout : chaque message est accompagné d’une lecture précise du contexte et des choix possibles.</p><button class="btn btn-primary" data-go="cases">${ico('chat')} Étudier les dialogues</button></article><article class="feature-panel"><span class="eyebrow">LES FONDEMENTS</span><h3>Une étude n’est pas une promesse.</h3><p>Les recherches éclairent la communication interpersonnelle. Elles ne démontrent pas qu’une formule peut contrôler les sentiments ou garantir un résultat amoureux.</p><div class="research-line"><strong>08</strong><p>Publications sélectionnées, expliquées et accessibles.</p></div><button class="btn btn-quiet" data-go="sources">Consulter les études ${ico('arrow')}</button></article></div>`}
function modules(){return `<header class="page-title"><div class="eyebrow">LE PROGRAMME</div><h1>Une méthode, à chaque étape.</h1><p>Chaque module développe une compétence distincte, illustrée par des dialogues et des exercices ciblés.</p></header><div class="module-grid">${COURSE.modules.map(mcard).join('')}</div><div class="feature-section"><section class="feature-panel"><span class="eyebrow">VOTRE MÉTHODE</span><h3>Lire. Comprendre. Pratiquer.</h3><p>Découvrez le principe, étudiez des dialogues complets, puis entraînez-vous à prendre des décisions. Conservez vos découvertes dans votre carnet.</p></section><section class="feature-panel dark"><span class="eyebrow">VOTRE PROGRESSION</span><h3>${countDone()} / 15 leçons</h3><p>Progression enregistrée uniquement dans ce navigateur.</p><div class="progress"><span style="width:${Math.round(countDone()/15*100)}%"></span></div></section></div>`}
function modulePage(m){return `<div class="crumbs"><button data-go="modules">Modules</button><span>›</span>Module ${m.id.slice(-1)}</div><div class="module-cover"><div class="left"><span class="eyebrow accent">MODULE ${m.id.slice(-1)} · ${esc(m.eyebrow)}</span><h1>${esc(m.name)}</h1><p>${esc(m.tagline)}</p><div class="btn-row"><button class="btn btn-primary" data-action="lesson" data-mid="${m.id}" data-li="${Math.max(0,m.lessons.findIndex((l,i)=>!S.complete[lessonId(m.id,i)]))}">${ico('book')} Reprendre la formation</button></div></div><div class="right">${pic(m.photo,m.name)}</div></div><div class="chapter-layout"><div><article class="chapter-block"><span class="eyebrow" style="color:#a4845f">VOTRE OBJECTIF</span><h2>Une compétence en trois étapes.</h2><p class="muted" style="font-size:13px;margin:0">${esc(m.outcome)}</p><div style="margin-top:10px">${m.lessons.map((l,i)=>`<button class="lesson-link" data-action="lesson" data-mid="${m.id}" data-li="${i}"><span class="lesson-num">${S.complete[lessonId(m.id,i)]?ico('check'):String(i+1).padStart(2,'0')}</span><span style="flex:1"><b>${esc(l.title)}</b><small>${esc(l.kicker)} · lecture et exercice</small></span><span class="chev">${ico('right')}</span></button>`).join('')}</div></article></div><aside><div class="aside-box dark"><span class="eyebrow">VOTRE PROGRESSION</span><h3>${completion(m)}% terminé</h3><div class="progress"><span style="width:${completion(m)}%"></span></div><p>${m.lessons.filter((l,i)=>S.complete[lessonId(m.id,i)]).length} de 3 leçons terminées.</p></div><div class="aside-box"><span class="eyebrow">SOURCES ASSOCIÉES</span><h3>Consulter les références.</h3>${m.refs.map(r=>`<button class="aside-ref" data-action="source" data-ref="${r}">${esc(ref(r)?.authors||r)} · ${esc(ref(r)?.year||'')} ↗</button>`).join('')}</div><div class="aside-box"><span class="eyebrow">MISE EN PRATIQUE</span><p>Les études ne démontrent aucune méthode universelle pour séduire. Elles offrent des repères pour mieux comprendre et communiquer.</p><button class="btn btn-outline" data-go="lab" style="font-size:12px">Ouvrir l’atelier ${ico('arrow')}</button></div></aside></div>`}
function lessonPage(m,i){let l=m.lessons[i],id=lessonId(m.id,i),saved=S.notes[id]||'';return `<div class="crumbs"><button data-go="modules">Modules</button><span>›</span><button data-action="module" data-mid="${m.id}">${esc(m.name)}</button><span>›</span>Leçon ${i+1}</div><div class="lesson-banner">${pic(m.photo,m.name)}<div class="overlay"><span class="eyebrow accent">MODULE ${m.id.slice(-1)} · LEÇON ${i+1} SUR 3</span><h1>${esc(l.title)}</h1><span class="small" style="color:#ddd1be">${esc(l.kicker)} · Lecture et mise en pratique</span></div></div><div class="chapter-layout"><div><article class="reading"><span class="eyebrow">L’IDÉE ESSENTIELLE</span><p class="reading-lead">${esc(l.lead)}</p><div class="line"></div><h2>Ce qu’il faut comprendre</h2>${l.body.map(p=>`<p>${esc(p)}</p>`).join('')}<h2>Votre méthode en trois étapes</h2><div class="method-steps">${l.method.map((p,j)=>`<div class="method-step"><b>0${j+1}</b><span>${esc(p)}</span></div>`).join('')}</div><h2>Comparer les approches</h2><div class="comparison"><div class="compare"><div class="label">HORS CONTEXTE</div><p>${esc(l.bad)}</p></div><div class="compare good"><div class="label">RÉPONSE ADAPTÉE</div><p>${esc(l.good)}</p></div></div></article><section class="quiz"><span class="eyebrow">VÉRIFIEZ VOTRE COMPRÉHENSION</span><h2>${esc(l.question)}</h2>${l.options.map((o,j)=>`<button class="quiz-opt ${(view.quiz===j?j===l.answer?'correct':'wrong':'')}" data-action="quiz" data-opt="${j}"><i>${String.fromCharCode(65+j)}</i><span>${esc(o)}</span></button>`).join('')}${view.quiz!==null?`<div class="feedback"><b>${view.quiz===l.answer?'Bonne lecture de la situation.':'Prenez un instant pour reconsidérer ce choix.'}</b><br>${esc(l.feedback)}</div>`:''}</section><section class="notebox"><span class="eyebrow" style="color:#a08058">CARNET PERSONNEL</span><h3>À mettre en pratique.</h3><p class="small muted">${esc(l.practice)}</p><textarea id="lessonNote" placeholder="Notez votre réflexion. Elle reste sur cet appareil.">${esc(saved)}</textarea><div class="btn-row"><button class="btn btn-outline" data-action="save-note">${ico('bookmark')} Enregistrer ma note</button><button class="btn btn-dark" data-action="complete">${ico('check')} ${S.complete[id]?'Terminée · continuer':'Marquer comme terminée'}</button></div><span class="note-status" id="noteStatus"></span></section></div><aside><section class="aside-box dark"><span class="eyebrow">LES ÉTUDES ASSOCIÉES</span><h3>Sources de cette leçon.</h3>${l.refs.map(id=>`<button class="aside-ref" data-action="source" data-ref="${id}">${esc(ref(id)?.authors||id)} · ${esc(ref(id)?.year||'')} ↗</button>`).join('')}<p>Les observations scientifiques ne garantissent aucun résultat individuel.</p></section><section class="aside-box"><span class="eyebrow">VOTRE PARCOURS</span><h3>Leçon ${i+1} de 3</h3><div class="progress"><span style="width:${(i+1)/3*100}%"></span></div><p>${esc(m.outcome)}</p><button class="btn btn-quiet" data-action="module" data-mid="${m.id}">Voir toutes les leçons ${ico('arrow')}</button></section></aside></div>`}
function casesPage(){let c=COURSE.cases.find(x=>x.id===view.caseid)||COURSE.cases[0];let row=c.conversation[view.row]||c.conversation[0];return `<header class="page-title"><div class="eyebrow">DIALOGUES COMMENTÉS · SIMULATIONS</div><h1>Découvrez ce qui se joue <em class="serif">entre</em> les répliques.</h1><p>Cinq dialogues pédagogiques originaux. Sélectionnez un message pour découvrir le raisonnement qui le sous-tend.</p></header><div class="case-selector">${COURSE.cases.map(x=>`<button class="case-tile" aria-pressed="${x.id===c.id}" data-action="case" data-case="${x.id}">${pic(x.image,x.title)}<span>${esc(x.title)}</span></button>`).join('')}</div><div class="case-layout"><section class="chat-panel"><span class="eyebrow" style="color:#a6875d">CAS ${c.id.slice(-1)} · MODULE ${c.mid.slice(-1)}</span><h2>${esc(c.title)}</h2><p>${esc(c.subtitle)} · simulation pédagogique, et non témoignage client</p><div class="chat-thread">${c.conversation.map((r,j)=>`<button class="chat-bubble ${view.row===j?'selected':''}" data-who="${esc(r[0])}" data-action="row" data-row="${j}"><small>${esc(r[0])} ${view.row===j?'· À LA LOUPE':''}</small>${esc(r[1])}</button>`).join('')}</div></section><aside class="analysis-panel"><span class="eyebrow">DÉCRYPTAGE DU MESSAGE ${view.row+1}/${c.conversation.length}</span><h2>${esc(row[0])} a fait un choix.</h2><p>${esc(row[2])}</p><button class="btn btn-dark" data-action="row" data-row="${(view.row+1)%c.conversation.length}">${ico('arrow')} Message suivant</button><p class="notreal">Ces échanges sont des simulations conçues pour l’apprentissage. Ils ne sont pas des enregistrements réels ni des résultats clients.</p></aside></div>`}
function labPage(){return `<header class="page-title"><div class="eyebrow">ATELIER DES SITUATIONS</div><h1>À vous de jouer.</h1><p>Entraînez votre jugement face à des situations variées. Il ne s’agit pas de mémoriser une réplique universelle.</p></header><div class="lab-grid">${COURSE.labs.map((e,i)=>`<button class="lab-card" data-action="exercise" data-eid="${e.id}"><b>${String(i+1).padStart(2,'0')}</b><span style="flex:1"><h3>${esc(e.type)}</h3><p>${esc(mod(e.mid).name)} · 1 choix</p></span>${ico('arrow')}</button>`).join('')}</div>`}
function exercisePage(){let e=COURSE.labs.find(x=>x.id===view.exercise)||COURSE.labs[0];return `<div class="lab-screen"><div class="crumbs"><button data-go="lab">Atelier</button><span>›</span>${esc(e.type)}</div><header class="page-title"><span class="eyebrow">EXERCICE ${e.id.slice(-1)} SUR 8</span><h1>${esc(e.type)}.</h1><p>Lisez la situation attentivement avant de choisir.</p></header><div class="lab-scene"><span class="eyebrow" style="color:#987a56">SITUATION</span><p>${esc(e.scene)}</p></div><h2 class="serif" style="font-size:29px">${esc(e.q)}</h2>${e.options.map((x,i)=>`<button class="lab-answer ${view.answer===i?(i===e.answer?'correct':'wrong'):''}" data-action="answer" data-opt="${i}"><em>${String.fromCharCode(65+i)}</em><span>${esc(x)}</span></button>`).join('')}${view.answer!==null?`<div class="lab-feedback"><h3>${view.answer===e.answer?'Bonne décision.':'Un détail vous a échappé.'}</h3><p>${esc(e.why)}</p><button class="btn btn-primary" data-action="next-exercise">Exercice suivant ${ico('arrow')}</button></div>`:''}</div>`}
function sourcesPage(){return `<header class="page-title"><div class="eyebrow">BIBLIOTHÈQUE SCIENTIFIQUE</div><h1>La crédibilité commence par les sources.</h1><p>Des publications vérifiables associées à des notions précises. Pour chacune : ce que la recherche suggère, mais aussi ce qu’elle ne permet pas d’affirmer.</p></header><div class="source-grid">${COURSE.refs.map(r=>`<article class="source-card" id="source-${r.id}"><div style="display:flex;justify-content:space-between;align-items:center"><span class="eyebrow" style="color:#9e805c">${esc(r.type)}</span><span class="small muted">${r.year}</span></div><h3>${esc(r.title)}</h3><span class="publication">${esc(r.authors)} · ${esc(r.journal)}</span><p><b>Ce que l’étude éclaire :</b> ${esc(r.finding)}</p><p class="limitation"><b>Limites des résultats :</b> ${esc(r.limit)}</p><a href="${esc(r.url)}" target="_blank" rel="noopener noreferrer">Consulter la publication ↗</a></article>`).join('')}</div>`}
function notesPage(){let entries=Object.entries(S.notes).filter(([k,v])=>String(v).trim());return `<header class="page-title"><div class="eyebrow">MON CARNET</div><h1>Votre progression vous appartient.</h1><p>Vos notes restent enregistrées sur cet appareil. Elles ne sont envoyées à aucun serveur.</p></header>${entries.length?`<div class="notebook-list">${entries.map(([id,t])=>{let [mid,li]=id.split('-'),m=mod(mid),l=m?.lessons[Number(li)];return `<article class="note-item"><span class="eyebrow" style="color:#a1815d">${esc(m?.name||'Leçon')}</span><h3>${esc(l?.title||id)}</h3><p>${esc(t)}</p><button class="btn btn-quiet" data-action="lesson" data-mid="${mid}" data-li="${li}">Rouvrir cette leçon ${ico('arrow')}</button></article>`}).join('')}</div>`:`<section class="feature-panel" style="max-width:700px"><span class="welcome-decor">✍</span><span class="eyebrow">AUCUNE NOTE POUR LE MOMENT</span><h3>Tout commence à la première leçon.</h3><p>Pendant votre formation, notez des situations vécues et les points que vous souhaitez approfondir.</p><button class="btn btn-primary" data-go="modules">Choisir une leçon ${ico('arrow')}</button></section>`}<div class="btn-row" style="margin-top:24px"><button class="btn btn-outline" data-action="export">${ico('download')} Exporter mes données</button></div>`}
function render(){let body='';switch(view.page){case'home':body=home();break;case'modules':body=modules();break;case'module':body=modulePage(mod(view.mid));break;case'lesson':body=lessonPage(mod(view.mid),view.li);break;case'cases':body=casesPage();break;case'lab':body=labPage();break;case'exercise':body=exercisePage();break;case'sources':body=sourcesPage();break;case'notes':body=notesPage();break;default:body=home()}document.getElementById('app').innerHTML=frame(body)}
document.addEventListener('click',e=>{let t=e.target.closest('[data-go],[data-action]');if(!t)return;if(t.dataset.go){e.preventDefault();go(t.dataset.go);return}let action=t.dataset.action;if(action==='module')go('module',t.dataset.mid);if(action==='lesson')go('lesson',t.dataset.mid,Number(t.dataset.li));if(action==='quiz'){view.quiz=Number(t.dataset.opt);render()}if(action==='complete'){let id=lessonId(view.mid,view.li);S.complete[id]=true;S.last=id;save();let m=mod(view.mid);if(view.li+1<m.lessons.length)go('lesson',view.mid,view.li+1);else go('module',view.mid)}if(action==='save-note'){let id=lessonId(view.mid,view.li);S.notes[id]=document.querySelector('#lessonNote')?.value||'';save();let s=document.querySelector('#noteStatus');if(s)s.textContent='Note enregistrée sur cet appareil.';}if(action==='case'){view.caseid=t.dataset.case;view.row=0;render()}if(action==='row'){view.row=Number(t.dataset.row);render()}if(action==='exercise'){view.exercise=t.dataset.eid;view.answer=null;go('exercise')}if(action==='answer'){view.answer=Number(t.dataset.opt);render()}if(action==='next-exercise'){let i=COURSE.labs.findIndex(x=>x.id===view.exercise);view.exercise=COURSE.labs[(i+1)%COURSE.labs.length].id;view.answer=null;render();scrollTo({top:0,behavior:'smooth'})}if(action==='source'){go('sources');requestAnimationFrame(()=>document.querySelector('#source-'+t.dataset.ref)?.scrollIntoView({behavior:'smooth',block:'center'}))}if(action==='export'){let blob=new Blob([JSON.stringify({complete:S.complete,notes:S.notes,exported:new Date().toISOString()},null,2)],{type:'application/json'});let link=document.createElement('a');link.href=URL.createObjectURL(blob);link.download='tchat-love-mon-carnet.json';link.click();setTimeout(()=>URL.revokeObjectURL(link.href),1500)}});
render();
</script></body></html>
